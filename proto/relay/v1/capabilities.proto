syntax = "proto3";

package relay.v1;

// Capabilities advertises typed V1 behavior. The Opus RTP clock is always
// 48,000 Hz and is therefore not negotiable here.
message Capabilities {
  // Integer microseconds preserve the 2.5 ms Opus duration as 2500.
  repeated uint32 opus_frame_durations_us = 1;
  uint32 max_opus_bitrate_bps = 2;
  bool inband_fec = 3;
  bool dtx = 4;
  bool turn_tls = 5;
  bool ice_restart = 6;
  uint32 max_audio_tracks = 7;
  repeated uint32 opus_channel_counts = 8;

  reserved 9 to 15;
}
