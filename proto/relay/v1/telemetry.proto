syntax = "proto3";

package relay.v1;

import "relay/v1/common.proto";

// TelemetryEvent contains bounded operational measurements only. Producers
// MUST NOT include authentication data, cookies, SDP, ICE credentials, raw
// media, user content, or arbitrary unreviewed key/value attributes.
message TelemetryEvent {
  string event_id = 1;
  // Short-lived, export-specific pseudonyms. Public session IDs, peer IDs,
  // share tokens, and authentication identifiers MUST NOT be copied here.
  string session_correlation_id = 2;
  string peer_correlation_id = 3;
  uint64 observed_at_unix_us = 4;
  TraceContext trace = 5;

  oneof measurement {
    ConnectionMeasurement connection = 16;
    AudioMeasurement audio = 17;
    ProtocolMeasurement protocol = 18;
  }

  reserved 6 to 15;
  reserved 19 to 31;
}

message ConnectionMeasurement {
  ConnectionState state = 1;
  uint32 round_trip_time_us = 2;
  uint64 packets_sent = 3;
  uint64 packets_received = 4;
  uint64 packets_lost = 5;
  uint64 bytes_sent = 6;
  uint64 bytes_received = 7;

  reserved 8 to 15;
}

enum ConnectionState {
  CONNECTION_STATE_UNSPECIFIED = 0;
  CONNECTION_STATE_CONNECTING = 1;
  CONNECTION_STATE_CONNECTED = 2;
  CONNECTION_STATE_DEGRADED = 3;
  CONNECTION_STATE_DISCONNECTED = 4;

  reserved 5 to 15;
}

message AudioMeasurement {
  string codec = 1;
  uint32 sample_rate_hz = 2;
  uint32 channel_count = 3;
  uint32 frame_duration_us = 4;
  uint32 jitter_us = 5;
  uint32 playout_delay_us = 6;
  uint64 concealed_frames = 7;

  reserved 8 to 15;
}

message ProtocolMeasurement {
  ProtocolVersion version = 1;
  uint64 revision = 2;
  ProtocolOutcome outcome = 3;
  ErrorCodeClass error_class = 4;

  reserved 5 to 15;
}

enum ProtocolOutcome {
  PROTOCOL_OUTCOME_UNSPECIFIED = 0;
  PROTOCOL_OUTCOME_ACCEPTED = 1;
  PROTOCOL_OUTCOME_REJECTED = 2;
  PROTOCOL_OUTCOME_RETRIED = 3;

  reserved 4 to 15;
}

// Coarse error classes prevent telemetry from becoming a channel for detailed
// internal errors or sensitive peer-supplied strings.
enum ErrorCodeClass {
  ERROR_CODE_CLASS_UNSPECIFIED = 0;
  ERROR_CODE_CLASS_CLIENT = 1;
  ERROR_CODE_CLASS_AUTHORIZATION = 2;
  ERROR_CODE_CLASS_CONFLICT = 3;
  ERROR_CODE_CLASS_SERVER = 4;

  reserved 5 to 15;
}
