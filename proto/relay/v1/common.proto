syntax = "proto3";

package relay.v1;

// ProtocolVersion is negotiated during the hello/welcome exchange.
message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;

  reserved 3 to 15;
}

// Endpoint identifies an advertised network endpoint. Credentials and other
// secret material must never be placed in metadata.
message Endpoint {
  string host = 1;
  uint32 port = 2;
  TransportProtocol transport = 3;
  map<string, string> metadata = 4;

  reserved 5 to 15;
}

enum TransportProtocol {
  TRANSPORT_PROTOCOL_UNSPECIFIED = 0;
  TRANSPORT_PROTOCOL_UDP = 1;
  TRANSPORT_PROTOCOL_TCP = 2;
  reserved 3 to 15;
  reserved "TRANSPORT_PROTOCOL_QUIC";
}

// TraceContext carries correlation identifiers only, never authentication
// tokens, cookies, SDP, ICE credentials, or user-provided secret values.
message TraceContext {
  string trace_id = 1;
  string span_id = 2;

  reserved 3 to 15;
}
