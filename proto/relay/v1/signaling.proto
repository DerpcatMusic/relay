syntax = "proto3";

package relay.v1;

import "relay/v1/capabilities.proto";
import "relay/v1/common.proto";

// Envelope is the relay.v1 unit exchanged by signaling peers. Version.major
// MUST be 1 for this package. Before negotiation, Hello carries the sender's
// highest supported minor version; Welcome selects the negotiated minor.
//
// A signaling server MUST derive session and peer identity from the
// authenticated socket and reject values that do not match that binding.
message Envelope {
  ProtocolVersion version = 1;
  string message_id = 2;
  string session_id = 3;
  string peer_id = 4;
  uint64 revision = 5;

  oneof payload {
    Hello hello = 16;
    Welcome welcome = 17;
    Offer offer = 18;
    Answer answer = 19;
    IceCandidate ice_candidate = 20;
    PeerUpdate peer_update = 21;
    RouteUpdate route_update = 22;
    Error error = 23;
  }

  reserved 6 to 15;
  reserved 24 to 31;
}

message Hello {
  repeated ProtocolVersion supported_versions = 1;
  Capabilities capabilities = 2;
  string client_name = 3;
  string client_version = 4;

  oneof entry {
    InitialJoin initial_join = 5;
    ResumeRequest resume = 6;
  }

  reserved 7 to 15;
}

// InitialJoin is used only after the WebSocket has been authenticated and
// bound to a session by a short-lived join ticket outside this envelope.
message InitialJoin {}

message ResumeRequest {
  // Secret bearer value. Implementations MUST redact it from all logs.
  string resume_token = 1;
  uint64 last_seen_revision = 2;

  reserved 3 to 15;
}

message Welcome {
  ProtocolVersion selected_version = 1;
  string assigned_session_id = 2;
  string assigned_peer_id = 3;
  Capabilities capabilities = 4;
  // Rotated on every successful initial join or resume. Never log this value.
  string resume_token = 5;
  uint64 current_revision = 6;

  oneof recovery {
    ResumeAccepted resume_accepted = 7;
    FullRenegotiationRequired full_renegotiation_required = 8;
  }

  reserved 9 to 15;
}

message ResumeAccepted {
  repeated ReplayEvent missing_events = 1;

  reserved 2 to 15;
}

message FullRenegotiationRequired {
  string reason_code = 1;

  reserved 2 to 15;
}

message Offer {
  string target_peer_id = 1;
  string sdp = 2;

  reserved 3 to 15;
}

message Answer {
  string target_peer_id = 1;
  string sdp = 2;

  reserved 3 to 15;
}

message IceCandidate {
  string target_peer_id = 1;
  string candidate = 2;
  optional string sdp_mid = 3;
  optional uint32 sdp_mline_index = 4;
  optional string username_fragment = 5;
  bool end_of_candidates = 6;

  reserved 7 to 15;
}

message PeerUpdate {
  PeerUpdateKind kind = 1;
  string subject_peer_id = 2;
  Capabilities capabilities = 3;

  reserved 4 to 15;
}

enum PeerUpdateKind {
  PEER_UPDATE_KIND_UNSPECIFIED = 0;
  PEER_UPDATE_KIND_JOINED = 1;
  PEER_UPDATE_KIND_UPDATED = 2;
  PEER_UPDATE_KIND_LEFT = 3;

  reserved 4 to 15;
}

message RouteUpdate {
  string source_peer_id = 1;
  string destination_peer_id = 2;
  repeated Endpoint endpoints = 3;
  RouteUpdateKind kind = 4;

  reserved 5 to 15;
}

enum RouteUpdateKind {
  ROUTE_UPDATE_KIND_UNSPECIFIED = 0;
  ROUTE_UPDATE_KIND_UPSERT = 1;
  ROUTE_UPDATE_KIND_REMOVE = 2;

  reserved 3 to 15;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
  string related_message_id = 3;
  bool retryable = 4;

  reserved 5 to 15;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_MESSAGE = 1;
  ERROR_CODE_UNSUPPORTED_VERSION = 2;
  ERROR_CODE_REVISION_CONFLICT = 3;
  ERROR_CODE_NOT_FOUND = 4;
  ERROR_CODE_PERMISSION_DENIED = 5;
  ERROR_CODE_INTERNAL = 6;

  reserved 7 to 31;
}

// ReplayEvent is ordered by strictly increasing revision. It deliberately
// excludes Hello, Welcome, and Error because those are connection-local.
message ReplayEvent {
  uint64 revision = 1;

  oneof payload {
    Offer offer = 16;
    Answer answer = 17;
    IceCandidate ice_candidate = 18;
    PeerUpdate peer_update = 19;
    RouteUpdate route_update = 20;
  }

  reserved 2 to 15;
  reserved 21 to 31;
}
